<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주간보고서 — 이규영</title>
<style>
  body {
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    background: #0f0f10;
    color: #eee;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .wrap {
    max-width: 560px;
    width: 100%;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 1.2rem;
  }
  .report {
    background: #1a1a1c;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .report .period {
    font-weight: bold;
    margin-bottom: 8px;
  }
  .report .day {
    margin-bottom: 6px;
    font-size: 0.9rem;
  }
  .report .day .dow {
    color: #888;
    margin-right: 6px;
  }
  .report .day .leave {
    color: #ffb454;
    margin-left: 6px;
    font-size: 0.8rem;
  }
  .empty {
    color: #888;
    text-align: center;
    margin-top: 40px;
  }
  a.back {
    display: inline-block;
    margin-top: 10px;
    margin-bottom: 20px;
    color: #888;
    text-decoration: none;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/">← 돌아가기</a>
    <h1>📊 주간보고서 히스토리</h1>
    <div id="list"><div class="empty">불러오는 중...</div></div>
  </div>

<script>
  const SUPABASE_URL = "https://oenqrlgmnkpzxsavnfyo.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_sZ4wQgaC5f-i40pVzf0vIA_R7iJWDf5";

  async function loadReports() {
    const list = document.getElementById("list");
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/weekly_reports?select=report_date,report_data&order=report_date.desc`,
        {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          },
        }
      );
      const rows = await res.json();

      if (!rows.length) {
        list.innerHTML = '<div class="empty">아직 저장된 주간보고서가 없습니다.</div>';
        return;
      }

      list.innerHTML = rows
        .map((row) => {
          const d = row.report_data;
          if (!d) return "";
          const days = (d.days || [])
            .map(
              (day) =>
                `<div class="day"><span class="dow">${day.date}(${day.dow})</span>${(day.tasks || []).join(", ")}${
                  day.leave ? `<span class="leave">${day.leave}</span>` : ""
                }</div>`
            )
            .join("");
          return `<div class="report">
            <div class="period">${d.periodStart} ~ ${d.periodEnd}</div>
            ${days}
          </div>`;
        })
        .join("");
    } catch (err) {
      list.innerHTML = '<div class="empty">불러오기 실패: ' + err.message + "</div>";
    }
  }

  loadReports();
</script>
</body>
</html>
