<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주간보고서 — 이규영</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d1b2a">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <div class="wrap">
    <a class="back" href="/">← 돌아가기</a>
    <h1 style="font-size:1.4rem;margin-bottom:0.6rem;">주간보고서 히스토리</h1>
    <button id="genBtn" type="button" style="margin-bottom:6px;">이번 주 주간보고서 생성하기</button>
    <div class="msg" id="genMsg"></div>
    <a href="sakyowon-hwp://generate" style="display:inline-block;margin-bottom:6px;">한글파일로 만들기</a>
    <div id="list" style="margin-top:20px;"><div class="empty">불러오는 중...</div></div>
    <div style="text-align:center;margin-top:28px;">
      <img src="/flowerpot.png" alt="" id="pot" style="width:80px;cursor:pointer;">
    </div>
  </div>

<script>
  document.getElementById("pot").addEventListener("click", () => {
    const pw = prompt("암호를 입력하세요");
    if (pw === "0130") {
      sessionStorage.setItem("warehousePw", pw);
      location.href = "warehouse.html";
    } else if (pw !== null) {
      alert("틀렸습니다.");
    }
  });
</script>

<script>
  const SUPABASE_URL = "https://oenqrlgmnkpzxsavnfyo.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_sZ4wQgaC5f-i40pVzf0vIA_R7iJWDf5";

  async function loadReports() {
    const list = document.getElementById("list");
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/weekly_reports?select=report_date,report_data&archived=eq.false&order=report_date.desc`,
        {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          },
        }
      );
      const rows = await res.json();

      if (!rows.length) {
        list.innerHTML = '<div class="empty">아직 저장된 주간보고서가 없습니다.</div>';
        return;
      }

      list.innerHTML = rows
        .map((row) => {
          const d = row.report_data;
          if (!d) return "";
          const days = (d.days || [])
            .map(
              (day) =>
                `<div class="day"><span class="dow">${day.date}(${day.dow})</span>${(day.tasks || []).join(", ")}${
                  day.leave ? `<span class="leave">${day.leave}</span>` : ""
                }</div>`
            )
            .join("");
          return `<div class="report">
            <div class="period">${d.periodStart} ~ ${d.periodEnd}</div>
            ${days}
          </div>`;
        })
        .join("");
    } catch (err) {
      list.innerHTML = '<div class="empty">불러오기 실패: ' + err.message + "</div>";
    }
  }

  loadReports();

  document.getElementById("genBtn").addEventListener("click", async () => {
    const btn = document.getElementById("genBtn");
    const msg = document.getElementById("genMsg");
    btn.disabled = true;
    btn.textContent = "생성 중...";
    msg.className = "msg";
    try {
      const res = await fetch("/api/generate-weekly-report", { method: "POST" });
      const data = await res.json();
      if (res.ok && data.success) {
        msg.className = "msg ok";
        msg.textContent = data.updated ? "이번 주 보고서를 최신 내용으로 갱신했습니다." : "이번 주 보고서가 생성됐습니다.";
        loadReports();
      } else {
        msg.className = "msg err";
        msg.textContent = "실패: " + (data.error || "알 수 없는 오류");
      }
    } catch (err) {
      msg.className = "msg err";
      msg.textContent = "실패: " + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = "이번 주 주간보고서 생성하기";
    }
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script>
</body>
</html>
