<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사교원</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d1b2a">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <div class="card" style="padding-top:40px;">
    <div style="width:100%;">
      <div style="height:180px;border-radius:16px;overflow:hidden;margin-bottom:1rem;">
        <img src="/logo.jpg" alt="앱 설치" id="installBtn" style="width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;">
      </div>
      <div class="links">
        <a class="link-btn" href="/daily-log.html">오늘 업무 입력</a>
        <a class="link-btn" href="/reports.html">주간보고서</a>
        <a class="link-btn" href="/todo.html">투두리스트</a>
        <a class="link-btn" href="https://sakyowon-wiki-2a5.pages.dev" target="_blank">내 위키</a>
      </div>
    </div>
  </div>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }

  let deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
  });

  document.getElementById("installBtn").addEventListener("click", async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
    } else if (window.matchMedia("(display-mode: standalone)").matches) {
      alert("이미 앱으로 설치되어 있습니다.");
    } else if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
      alert("아이폰에서는: 하단 공유 버튼(□↑) → \"홈 화면에 추가\"를 눌러주세요.");
    } else {
      alert("이 브라우저에서는 자동 설치를 지원하지 않아요. 브라우저 메뉴에서 \"앱 설치\" 또는 \"홈 화면에 추가\"를 찾아주세요.");
    }
  });
</script>
<script src="/hub-nav.js"></script>
</body>
</html>
